[project]
name = "unitramite-ai"
version = "0.1.0"
description = "Prototipo académico de chatbot de atención a estudiantes"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit==1.40.2",
    "psycopg[binary]==3.2.12",
    "openai==3.39.0",
    "scikit-learn==1.9.1",
    "pymupdf==2.0.0",
]

[project.optional-dependencies]
# Solo para el webhook de WhatsApp (whatsapp_webhook.py), que aún no está conectado
whatsapp = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
]

[tool.uv]
# Es una aplicación, no una librería que se publique
package = false
